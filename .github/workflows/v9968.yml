name: V9968 (buppu3) build and release

# Builds openMSX FERPECT for Windows (MinGW-w64), Linux and macOS (Intel and
# Apple Silicon) on every push to main. When the tag in FERPECT_VERSION has no
# GitHub Release yet, it creates that Release and attaches all the packages;
# if it exists, it uploads them again.

on:
  push:
    branches:
      - v9968-buppu3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            name: Windows x86_64
            cpu: x86_64
            os: mingw-w64
            plat: windows-x86_64
          - image: ubuntu-latest
            name: Linux x86_64
            cpu: x86_64
            os: linux
            plat: linux-x86_64
          - image: macos-15
            xcode_version: 16.4
            name: macOS Intel
            cpu: x86_64
            os: darwin
            plat: mac-x86_64
          - image: macos-15
            xcode_version: 16.4
            name: macOS Apple Silicon
            cpu: aarch64
            os: darwin
            plat: mac-arm64
    steps:
    - name: Get current code from Git repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Select Xcode version
      if: ${{ matrix.xcode_version }}
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app/Contents/Developer
    - name: Build
      uses: ./.github/actions/build
      with:
        os: ${{ matrix.os }}
        cpu: ${{ matrix.cpu }}
        flavour: opt
    - name: Package
      id: pkg
      shell: bash
      run: |
        VERSION=`cat FERPECT_VERSION | tr -d '\r\n'`
        NAME=openMSX-${VERSION}-${{ matrix.plat }}
        D=derived/${{ matrix.cpu }}-${{ matrix.os }}-opt-3rd
        if [ "${{ matrix.os }}" = "darwin" ]; then
          SRC=`ls $D/*.dmg | head -1`
          cp "$SRC" "$D/$NAME.dmg"
          OUT="$D/$NAME.dmg"
        else
          # the build action already moved bindist/install to openmsx-<version>-...-bin
          SRC=`ls -d $D/openmsx-*-bin | head -1`
          mv "$SRC" "$D/$NAME"
          cp README_V9968.md "$D/$NAME/"
          (cd "$D" && zip -qr "$NAME.zip" "$NAME")
          OUT="$D/$NAME.zip"
        fi
        echo "out=$OUT" >> $GITHUB_OUTPUT
        echo "name=$NAME" >> $GITHUB_OUTPUT
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.pkg.outputs.name }}
        path: ${{ steps.pkg.outputs.out }}
        if-no-files-found: error

  release:
    name: Create or update the GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Get current code from Git repo
      uses: actions/checkout@v5
    - name: Download all packages
      uses: actions/download-artifact@v6
      with:
        path: paquetes
        pattern: openMSX-*
        merge-multiple: true
    - name: Create GitHub Release (only if it does not exist yet)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -l paquetes
        TAG=`cat FERPECT_VERSION | tr -d '\r\n'`
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists, uploading the packages again"
          gh release upload "$TAG" paquetes/* --clobber
        else
          gh release create "$TAG" paquetes/* \
            --target "$GITHUB_SHA" \
            --title "`cat FERPECT_TITLE | tr -d '\r\n'`" \
            --notes-file RELEASE_NOTES.md --prerelease --latest=false
        fi
        # remove anything that is not one of our packages (older runs
        # attached the build action's own artifacts too)
        gh release view "$TAG" --json assets -q '.assets[].name' | \
          grep -v '^openMSX-' | while read -r A; do
            gh release delete-asset "$TAG" "$A" -y
          done
